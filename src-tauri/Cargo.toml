[package]
name = "aliasist-files-abductor"
version = "3.0.0"
description = "Aliasist Files Abductor — YouTube & direct URL downloader"
authors = ["dev_aliasist"]
license = "Unlicense"
repository = "https://github.com/aliasist/files-abductor-rs"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
