[package]
name = "aliasist-files-abductor"
version = "3.0.0"
default-run = "aliasist-files-abductor"
description = "Aliasist Files Abductor — YouTube & direct URL downloader"
authors = ["dev_aliasist"]
license = "Unlicense"
repository = "https://github.com/aliasist/files-abductor-rs"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync"] }
# Only pulled in by src/bin/server.rs (the standalone mobile-facing HTTP
# server) — the desktop Tauri binary doesn't touch these.
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "abductor-server"
path = "src/bin/server.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
